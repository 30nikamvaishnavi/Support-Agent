name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python unit tests (no API key or extra packages needed)
        run: python -m unittest discover -s tests -t . -v
      - name: Front-end helper tests
        run: node web/helpers.test.js
